<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Хадгалсан (эсвэл системийн) горимыг хуудас зурагдахаас өмнө тохируулна — цагаан "анивчилт" гарахгүй. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <title>Онлайн хурал, санал хураалт ба санал асуулгын платформ | МҮХАҮТ</title>
    <meta
      name="description"
      content="МҮХАҮТ — онлайн хурал, санал хураалт, санал асуулга болон оролцогчдын шууд санал бодлыг нэг дор удирдах байгууллагын платформ."
    />
    <link rel="canonical" href="https://meetsync.mn/" />
